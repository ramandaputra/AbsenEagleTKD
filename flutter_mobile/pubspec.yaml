name: eagle_tkd_mobile
description: "Aplikasi Mobile Sistem Informasi Absensi dan Penjadwalan Pelatih/Asisten Pelatih Taekwondo"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

